# Задание 2: "публикация-подписка" — fanout раздаёт копию события во все очереди отделов.

services:
  # Брокер сообщений
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-task2
    ports:
      - "5673:5672"      # AMQP
      - "15673:15672"    # management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Издатель: разослал события и закончил работу
  publisher:
    command: ["python", "-m", "app.publisher"]
    build: .
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
    depends_on:
      rabbitmq: {condition: service_healthy}

  # Три отдела на одном коде — различаются только очередью и отображаемым именем
  accounting:
    build: .
    command: ["python", "-m", "app.consumer"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
      DEPT_NAME: Бухгалтерия
      QUEUE: price.accounting
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  oildepot:
    build: .
    command: ["python", "-m", "app.consumer"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
      DEPT_NAME: Нефтебаза
      QUEUE: price.oildepot
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  analytics:
    build: .
    command: ["python", "-m", "app.consumer"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
      DEPT_NAME: Аналитика
      QUEUE: price.analytics
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
