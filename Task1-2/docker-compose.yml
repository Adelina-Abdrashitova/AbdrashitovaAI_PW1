# Задание 1 + канал недоставленных сообщений: неудачные заявки уходят в DLQ.

services:
  # Брокер сообщений
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-task1-2
    ports:
      - "5674:5672"      # AMQP
      - "15674:15672"    # management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Диспетчер: разослал заявки и закончил работу
  dispatcher:
    build: .
    command: ["python", "-m", "app.dispatcher"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
    depends_on:
      rabbitmq: {condition: service_healthy}

  # Команды: одинаковый образ, три контейнера читают одну и ту же очередь
  team-1:
    build: .
    command: ["python", "-m", "app.team"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
      TEAM_NAME: команда-1
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  team-2:
    build: .
    command: ["python", "-m", "app.team"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
      TEAM_NAME: команда-2
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  team-3:
    build: .
    command: ["python", "-m", "app.team"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
      TEAM_NAME: команда-3
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  # Разбор заявок, которые не смогли выполнить бригады
  dlq-consumer:
    build: .
    command: ["python", "-m", "app.dlq_consumer"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: app
      DLQ_NAME: разбор-заявок
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
